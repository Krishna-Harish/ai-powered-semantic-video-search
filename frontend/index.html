<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Search</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

  <header>
    <h1>AI Video Search</h1>
    <p class="subtitle">Semantic search inside your video collection</p>
  </header>

  <section class="ingest-panel">
    <form id="ingestForm" class="ingest-form">
      <input type="url" id="youtubeUrlInput" placeholder="Paste a YouTube link, e.g. https://www.youtube.com/watch?v=..." required>
      <button type="submit" id="ingestBtn">Add video</button>
    </form>
    <p class="hint">The video is downloaded, transcribed and indexed automatically. This can take a few minutes.</p>
    <div id="jobsList" class="jobs-list"></div>
  </section>

  <main>
    <section class="video-panel">
      <div class="video-select-row">
        <label for="videoSelect">Video:</label>
        <select id="videoSelect"></select>
      </div>
      <video id="videoPlayer" controls preload="metadata" hidden></video>
      <div id="emptyVideo" class="empty-video">No videos yet. Paste a YouTube link above to add one.</div>
      <div class="now-playing-row">
        <span id="nowPlaying" class="now-playing"></span>
        <button id="copyLinkBtn" class="link-btn" type="button" title="Copy a link to this moment">Copy link to this moment</button>
      </div>

      <div class="summary-panel">
        <h2>AI summary</h2>
        <div class="summary-actions">
          <button class="secondary-btn" type="button" data-summary-mode="summary">Summarize video</button>
          <button class="secondary-btn" type="button" data-summary-mode="takeaways">Key takeaways</button>
        </div>
        <div class="section-row">
          <label>From <input type="text" id="sectionStart" placeholder="00:00" size="7"></label>
          <button class="link-btn" type="button" data-set-time="sectionStart" title="Use the player's current time">now</button>
          <label>to <input type="text" id="sectionEnd" placeholder="05:00" size="7"></label>
          <button class="link-btn" type="button" data-set-time="sectionEnd" title="Use the player's current time">now</button>
          <button class="secondary-btn" type="button" data-summary-mode="section">Summarize section</button>
        </div>
        <p id="summaryStatus" class="status"></p>
        <div id="summaryOutput" class="summary-output"></div>
      </div>
    </section>

    <section class="search-panel">
      <div class="mode-toggle">
        <button id="textModeBtn" class="mode-btn active" data-mode="text">Text Search</button>
        <button id="visualModeBtn" class="mode-btn" data-mode="visual">Visual Search</button>
        <button id="askModeBtn" class="mode-btn" data-mode="ask">Ask AI</button>
      </div>

      <div class="search-box">
        <input type="text" id="queryInput" placeholder="e.g. Where is gradient descent explained?">
        <button id="searchBtn">Search</button>
      </div>
      <label id="askScopeRow" class="scope-row" hidden>
        <input type="checkbox" id="askThisVideoOnly"> Only use the selected video
      </label>

      <p id="statusMsg" class="status"></p>

      <div id="resultsList" class="results-list"></div>
    </section>
  </main>

</div>
  <script src="app.js"></script>
</body>
</html>
